[workspace]
resolver = "3"
members = [
    "crates/vxagent-common",
    "crates/vxprobe",
    "crates/vxtraffic",
]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/vxedge/vxagents"

[workspace.dependencies]
vxagent-common = { path = "crates/vxagent-common" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util"] }
clap = { version = "4", features = ["derive", "env"] }
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Perturbation budget (AGENTS.md): release binaries are what experiments run.
[profile.release]
lto = "thin"
codegen-units = 1
